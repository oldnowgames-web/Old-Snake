<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jogo da Cobra</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=play_circle" />
</head>
<body>
    <div class="game-container">
        <!-- Tela de Início (Start Screen) -->
        <div class="overlay-screen start-screen">
            <span class="game-title">Old Snake</span>
            <button class="btn-action btn-start">
                <span class="material-symbols-outlined">play_circle</span>
                JOGAR
            </button>
        </div>

        <!-- Tela de Game Over -->
        <div class="overlay-screen menu-screen">
            <span class="game-over">GAME OVER</span>
            <div class="final-score-container">
                <span class="final-score">SCORE:</span>
                <span>00</span>
            </div>

            <button class="btn-action btn-play">
                <span class="material-symbols-outlined">play_circle</span>
                JOGAR NOVAMENTE
            </button>
        </div>

        <!-- Placar e Área de Jogo -->
        <div class="score">SCORE: <span class="score--value">00</span></div>
        <canvas height="600" width="600"></canvas>
    </div>

    <script src="js/script.js" defer></script>
</body>
</html>
